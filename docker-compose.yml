# Local development stack: PostgreSQL + API.
# Frontend runs on the host with `npm run dev` (Vite proxies /api to localhost:8000).
# Credentials below are for local use only and must not be reused anywhere else.
# Host port 55432 is used on purpose: 5432 is often taken by a PostgreSQL installed on the developer machine.

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: qazmind
      POSTGRES_PASSWORD: qazmind
      POSTGRES_DB: qazmind
    ports:
      - "55432:5432"
    volumes:
      - qazmind-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qazmind -d qazmind"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./backend
      args:
        # Dev extras (pytest, httpx) are installed for local test runs only.
        INSTALL_DEV: "1"
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: local
      DATABASE_URL: postgresql+asyncpg://qazmind:qazmind@db:5432/qazmind
      PUBLIC_APP_URL: http://localhost:3000
      API_CORS_ORIGINS: '["http://localhost:3000"]'
      COOKIE_SECURE: "false"
      MAIL_MODE: dev_log
    ports:
      - "8000:8000"

volumes:
  qazmind-db:
